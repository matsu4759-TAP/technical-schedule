<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>技術部スケジュール管理表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- 合言葉入力画面 -->
  <div id="lock-screen" class="lock-screen" hidden>
    <form id="lock-form" class="lock-card">
      <h1 class="lock-title">合言葉を入力してください</h1>
      <p class="lock-sub">グループ内で共有されているスケジュール表です。</p>
      <input id="lock-input" class="lock-input" type="password" inputmode="text" autocomplete="off" placeholder="合言葉" required />
      <p id="lock-error" class="lock-error" hidden>合言葉が違います。もう一度お試しください。</p>
      <button type="submit" class="btn btn-primary lock-submit">開く</button>
    </form>
  </div>

  <!-- 設定未完了時の案内 -->
  <div id="setup-notice" class="setup-notice" hidden>
    <div class="setup-card">
      <h1>まだ設定が完了していません</h1>
      <p><code>docs/config.js</code> に Supabase の接続情報と合言葉を入力してください。</p>
      <p>手順は <code>docs/SETUP.md</code> に書かれています。</p>
    </div>
  </div>

  <div class="wrap" id="app" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
